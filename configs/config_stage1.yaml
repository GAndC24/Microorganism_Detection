runtime:
  seed: 42
  device: cuda  # 'cuda' or 'cpu'

data:
  data_root: "./data/processed/Urinary Sediment Dataset"
  batch_size: 32    # (32, 64)

stage1_model_config:
  num_classes: 7
  embed_dim: 512    # aligned with output channels of backbone
  img_size: 384   # (224, 384, 448)
  hidden_dim: 4096    # (1024, 2048, 4096)
  layer_indices: "8, 22, 29"    # (3, 8, 15, 22, 29, 30)
  mask_threshold: 0.2   # [0.1, 0.3]
  gaussian_sigma: 0.05   # [0.01, 0.1]
  patch_size: 3   # (2, 3)
  components_range: "2, 3, 4"
  random_state: 42
  max_iter: 20    # [20, 30]
  roi_out_size_mid: 21    # (14, 21), should be divisible by patch_size
  roi_out_size_high : 7    # (7, 14)
  sampling_ratio: 2   # [1, 3]

stage1_trainer_config:
  epochs: 50
  lr: 0.001
  warm_up_lr_factor: 0.01    # min_lr = warm_up_lr_factor * lr
  warmup_epochs: 5    # 1/10 epochs
  weight_decay: 0.05    # [0.05, 0.1]
  checkpoints_save_path: "./checkpoints/stage1/"
  model_save_path: "./results/model_weights/"
  dataset_mps_save_path: "./dataset_morphological_prototypes/"
  continue_train: True
  checkpoint_path: "./checkpoints/stage1/checkpoint_37.pth"  # ./checkpoints/stage1/checkpoint_{epoch}.pth
  w_img_loss: 0.2   # [0.1, 1.0]
  w_wbb_loss: 0.8   # [0.1, 1.0]  w_img_loss + w_wbb_loss = 1.0
  w_cam_loss: 0.8   # [0.1, 1.0]
  w_patch_loss: 1.0   # [0.1, 1.0]
  mp_ema_alpha: 0.99   # [0.9, 0.99]

supcon_loss_config:
  temperature: 0.07   # [0.05, 0.2]
  positives_cap: -1   # -1 for no cap, (2V, 4V, 6V, 8V) for cap


