runtime:
  seed: 42
  device: cuda
data:
  data_root: ./data/processed/Urinary Sediment Dataset
  batch_size: 32
stage1_model_config:
  num_classes: 7
  embed_dim: 768
  img_size: 384
  hidden_dim: 4096
  layer_indices: 8, 22, 29
  mask_threshold: 0.2
  gaussian_sigma: 0.05
  patch_size: 3
  components_range: 2, 3, 4
  random_state: 42
  max_iter: 20
  roi_out_size_mid: 21
  roi_out_size_high: 7
  sampling_ratio: 2
stage1_trainer_config:
  epochs: 40
  lr: 0.001
  warm_up_lr_factor: 0.01
  warmup_epochs: 4
  weight_decay: 0.05
  checkpoints_save_path: ./checkpoints/stage1/
  model_save_path: ./results/model_weights/
  dataset_mps_save_path: ./dataset_morphological_prototypes/
  continue_train: true
  checkpoint_path: ./checkpoints/stage1/checkpoint_37.pth
  w_img_loss: 0.2
  w_wbb_loss: 0.8
  w_cam_loss: 0.5
  mp_ema_alpha: 0.9
wbb_loss_config:
  temperature: 0.07
  positives_cap: -1
